name: Build Bionic Music APK

on:
  push:
    paths:
      - 'bionic-music/**'
      - '.github/workflows/build-bionic-music.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK components
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Generate Gradle wrapper
        working-directory: bionic-music
        run: gradle wrapper --gradle-version 8.5

      - name: Grant gradlew permission
        working-directory: bionic-music
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: bionic-music
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bionic-music-debug
          path: bionic-music/app/build/outputs/apk/debug/*.apk
          retention-days: 30
